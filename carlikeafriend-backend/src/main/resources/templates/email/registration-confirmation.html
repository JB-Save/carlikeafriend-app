<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { width: 90%; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .header { font-size: 24px; color: #333; }
        .content { margin-top: 20px; }
        .info { background-color: #f9f9f9; padding: 15px; border-radius: 4px; }
        .button {
            display: inline-block;
            padding: 12px 20px;
            margin-top: 20px;
            background-color: #1f88e6;
            color: #f4f3f2;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Mensaje claro -->
    <div class="header" th:text="'¡Hola, ' + ${username} + '! Bienvenido.'">¡Hola, [Usuario]! Bienvenido.</div>

    <div class="content">
        <p>Tu registro en Car Like A Friend ha sido completado exitosamente.</p>

        <!-- Confirmación de información -->
        <div class="info">
            <p><strong>Detalles de tu cuenta:</strong></p>
            <p><strong>Nombre de Usuario:</strong> <span th:text="${username}">[username]</span></p>
            <p><strong>Correo Electrónico:</strong> <span th:text="${email}">[email]</span></p>
        </div>

        <p>Es un gusto de tenerte con nosotros. Para comenzar, por favor inicia sesión en tu cuenta:</p>

        <!-- Enlace para iniciar sesión -->
        <a th:href="${loginUrl}" class="button">Iniciar Sesión Ahora</a>
    </div>
</div>
</body>
</html>
